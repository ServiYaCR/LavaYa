<!DOCTYPE html>
<html lang="es-CR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil · ServiYa</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div id="app-nav" class="app-nav"></div>

  <div class="screen" style="padding-top:20px;">
    <div class="card">
      <h1 class="title">Mi perfil</h1>
      <a href="pedidos-historial.html" class="btn btn-outline" style="margin-top:0; margin-bottom:20px;">Ver historial completo de pedidos</a>

      <form id="profile-form">
        <p class="section-label" style="margin-top:0;">Contacto</p>
        <label for="full_name">Nombre completo</label>
        <input type="text" id="full_name" required>

        <label for="phone">Número de WhatsApp</label>
        <input type="tel" id="phone" required>

        <p class="section-label">Ubicación de recogida</p>
        <div id="map-picker"></div>
        <button type="button" id="use-location" class="btn btn-outline" style="margin-top:8px;">📍 Centrar en mi ubicación actual</button>
        <p class="hint" id="coords-display"></p>
        <input type="hidden" id="latitude">
        <input type="hidden" id="longitude">

        <label for="province">Provincia</label>
        <select id="province" required></select>

        <label for="canton">Cantón</label>
        <select id="canton" required></select>

        <label for="address_notes">Señas particulares</label>
        <textarea id="address_notes" required></textarea>

        <label for="access_type">Tipo de acceso</label>
        <select id="access_type" required>
          <option value="condominio_seguridad">Condominio con guarda / seguridad</option>
          <option value="casa_independiente">Casa independiente</option>
          <option value="otro">Otro</option>
        </select>

        <p class="section-label">Pago</p>
        <label for="payment_method">Método de pago preferido</label>
        <select id="payment_method" required>
          <option value="card">Tarjeta de crédito/débito</option>
          <option value="sinpe">SINPE Móvil</option>
        </select>

        <button type="submit" class="btn btn-primary">Guardar cambios</button>
        <p class="hint" id="saved-msg" style="display:none; color: var(--color-success);">Guardado correctamente.</p>
        <p class="error-text" id="error-text"></p>
      </form>

      <a href="privacy-policy.html" class="btn btn-outline" style="margin-bottom:12px;">Política de Privacidad</a>
      <a href="terms.html" class="btn btn-outline">Términos y Condiciones</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/cr-locations.js"></script>
  <script src="js/logout.js"></script>
  <script src="js/nav.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/map-picker.js"></script>
  <script src="js/profile-customer.js"></script>
</body>
</html>
