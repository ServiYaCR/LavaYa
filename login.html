<!DOCTYPE html>
<html lang="es-CR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · ServiYa</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="screen">
    <div class="card">
      <h1 class="title">Bienvenido de vuelta</h1>
      <form id="login-form">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required>
        <label for="password">Contraseña</label>
        <input type="password" id="password" required>
        <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        <p class="error-text" id="error-text"></p>
      </form>
      <p class="footnote">¿No tienes cuenta? <a href="signup.html">Crear cuenta</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorText = document.getElementById('error-text');
      errorText.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) {
        errorText.textContent = error.message;
        errorText.style.display = 'block';
        return;
      }

      // role を見て適切な画面へ振り分け（role未設定ならrole-select.htmlへ）
      const { data: { user } } = await db.auth.getUser();
      const { data: profile } = await db.from('profiles').select('role').eq('id', user.id).single();

      if (!profile || !profile.role) {
        window.location.href = 'role-select.html';
      } else if (profile.role === 'customer') {
        window.location.href = 'dashboard-customer.html';
      } else {
        window.location.href = 'dashboard-provider.html';
      }
    });
  </script>
</body>
</html>
