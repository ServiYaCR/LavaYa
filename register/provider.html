<!DOCTYPE html>
<html lang="es-CR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Lavandero/a · ServiYa</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="screen">
    <div class="card">
      <h1 class="title">Únete como Lavandero/a</h1>
      <p class="subtitle">Necesitamos verificar tu identidad antes de activar tu cuenta.</p>

      <form id="provider-form">
        <p class="section-label">Contacto</p>
        <label for="phone">Número de WhatsApp</label>
        <input type="tel" id="phone" required placeholder="8888-8888">

        <p class="section-label">Identidad</p>
        <label for="cedula">Número de cédula</label>
        <input type="text" id="cedula" required placeholder="1-2345-6789" maxlength="11">
        <p class="hint" id="cedula-status"></p>

        <label for="face_photo">Foto de tu rostro</label>
        <input type="file" id="face_photo" accept="image/*" capture="user" required>

        <label for="cedula_photo">Foto de tu cédula (ambos lados si es posible)</label>
        <input type="file" id="cedula_photo" accept="image/*" required>

        <p class="section-label">Cobros</p>
        <label for="sinpe_phone">Número para recibir pagos por SINPE Móvil</label>
        <input type="tel" id="sinpe_phone" required placeholder="8888-8888">

        <p class="section-label">Equipo y zona de trabajo</p>
        <div class="checkbox-row">
          <input type="checkbox" id="has_washer_dryer" required>
          <label for="has_washer_dryer">Confirmo que tengo lavadora y secadora en funcionamiento en mi casa.</label>
        </div>

        <label for="service_radius">Radio de servicio (km)</label>
        <input type="number" id="service_radius" min="1" max="30" value="5" required>

        <label for="coords">Ubicación desde donde vas a operar</label>
        <button type="button" id="use-location" class="btn btn-outline" style="margin-top:0;">📍 Usar mi ubicación actual</button>
        <p class="hint" id="coords-display">Aún no se ha capturado tu ubicación.</p>
        <input type="hidden" id="latitude">
        <input type="hidden" id="longitude">

        <div class="checkbox-row">
          <input type="checkbox" id="accept_biometric" required>
          <label for="accept_biometric">Autorizo el uso de mi fotografía y número de cédula para verificar mi identidad, según la <a href="../privacy-policy.html" target="_blank">Política de Privacidad</a>.</label>
        </div>

        <button type="submit" class="btn btn-primary">Enviar para revisión</button>
        <p class="hint">Tu cuenta quedará en revisión hasta que confirmemos tu identidad. Normalmente toma menos de 24 horas.</p>
        <p class="error-text" id="error-text"></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/register-provider.js"></script>
</body>
</html>
